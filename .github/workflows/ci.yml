name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python-service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov --cov-report=term-missing --cov-fail-under=85

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B verify

  docker:
    runs-on: ubuntu-latest
    needs: [python-service, backend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
